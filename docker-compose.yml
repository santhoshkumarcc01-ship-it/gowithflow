version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aicampus-postgres
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_password_123
      POSTGRES_DB: aicampus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aicampus-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
